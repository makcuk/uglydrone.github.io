<!DOCTYPE html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="UglyDrone — rugged, modular platform" />
    <style>
      :root{
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #475569;
        --card: #f8fafc;
        --accent: #0ea5e9;
        --border: #e2e8f0;
        --shadow: 0 10px 30px rgba(2,6,23,.06), 0 2px 8px rgba(2,6,23,.04);
      }
      /* Dark theme variables */
      :root[data-theme="dark"]{
        --bg: #0b0f1a;     /* near-black blue */
        --fg: #e6edf3;     /* light slate */
        --muted: #9aa4b2;
        --card: #121827;
        --accent: #38bdf8;
        --border: #1f2937;
        --shadow: 0 10px 30px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.25);
      }
      /* Respect system preference if user hasn't chosen */
      @media (prefers-color-scheme: dark){
        :root[data-theme="auto"]{
          --bg: #0b0f1a;
          --fg: #e6edf3;
          --muted: #9aa4b2;
          --card: #121827;
          --accent: #38bdf8;
          --border: #1f2937;
          --shadow: 0 10px 30px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.25);
        }
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color:var(--fg); background:var(--bg);
        display:flex; flex-direction:column;
        transition: background .25s ease, color .25s ease;
      }
      .container{max-width:900px; margin:0 auto; padding:48px 20px 20px}
      header{display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:20px; position:relative}
      .logo-wrap{display:grid; place-items:center;}
      .logo{width:min(320px, 70vw); height:auto; display:block; filter: drop-shadow(0 6px 12px rgba(0,0,0,.12));}
      .theme-toggle{
        position:absolute; right:10px; top:10px;
        background:var(--card); border:1px solid var(--border); color:var(--fg);
        border-radius:999px; padding:8px 12px; cursor:pointer; font-size:.9rem;
        box-shadow: var(--shadow);
      }
      .card{
        background:var(--card); border:1px solid var(--border); border-radius:20px; padding:28px; box-shadow:var(--shadow);
      }
      .title{font-size:clamp(28px, 4vw, 40px); font-weight:800; letter-spacing:-.02em; text-align:center; margin:10px 0 6px}
      .subtitle{color:var(--muted); text-align:center; margin:0 0 14px}
      
      /* Navigation styles */
      .nav-bar{
        display:flex; justify-content:center; gap:12px; margin:16px 0 24px; width:100%; max-width:320px;
      }
      .nav-link{
        flex:1; text-align:center; padding:8px 16px; border-radius:999px; font-weight:600; font-size:.95rem;
        color:var(--muted); border:1px solid transparent; transition:all .2s ease;
      }
      .nav-link:hover{
        color:var(--fg); text-decoration:none; background:var(--card); border-color:var(--border);
      }
      .nav-link.active{
        color:var(--bg); background:var(--fg);
      }
      
      main{display:grid; gap:28px; margin-top:10px}
      .textbox{line-height:1.7; font-size:1rem}
      footer{margin-top:auto; border-top:1px solid var(--border); background:var(--card)}
      .footer-inner{max-width:900px; margin:0 auto; padding:26px 20px; display:grid; gap:12px}
      .contact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
      .contact-item{background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow); color:var(--fg)}
      .label{font-weight:700; margin-bottom:6px}
      a{color:var(--accent); text-decoration:none}
      a:hover{text-decoration:underline}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      
      /* Blog specific styles */
      .blog-feed{display:grid; gap:28px;}
      .post-card{margin-bottom:0;}
      .post-title-link{color:var(--fg); transition:color 0.2s ease;}
      .post-title-link:hover{color:var(--accent); text-decoration:none;}
      .post-header{margin-bottom:18px;}
      .post-title{font-size:clamp(22px, 3vw, 30px); font-weight:800; letter-spacing:-.02em; margin:0 0 6px 0;}
      .post-meta{font-size:.9rem; color:var(--muted); font-weight:500;}
      .read-more-btn{
        display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:.95rem; margin-top:14px;
        color:var(--accent); transition:transform .2s ease;
      }
      .read-more-btn:hover{
        text-decoration:underline; transform:translateX(3px);
      }
      .back-link{
        display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:.95rem; margin-bottom:20px;
        color:var(--muted); transition:color .2s ease;
      }
      .back-link:hover{
        color:var(--fg); text-decoration:none;
      }
      
      /* Code Block / Code Styling */
      pre{
        background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:18px;
        overflow-x:auto; margin:20px 0; box-shadow:inset 0 1px 4px rgba(0,0,0,.02);
      }
      code{
        font-family: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, Monaco, Consolas, monospace;
        font-size:.9rem; background:rgba(0,0,0,.04); padding:2px 6px; border-radius:6px;
      }
      [data-theme="dark"] code{
        background:rgba(255,255,255,.06);
      }
      pre code{
        background:none; padding:0; border-radius:0; font-size:.875rem;
      }
      
      /* Typography elements inside Markdown content */
      .post-content h2{font-size:1.6rem; font-weight:700; margin:32px 0 16px 0; border-bottom:1px solid var(--border); padding-bottom:8px;}
      .post-content h3{font-size:1.25rem; font-weight:700; margin:24px 0 12px 0;}
      .post-content p{margin:0 0 16px 0;}
      .post-content blockquote{
        border-left:4px solid var(--accent); margin:20px 0; padding-left:18px; color:var(--muted); font-style:italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header aria-label="UglyDrone logo">
        <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">Toggle theme</button>
        <div class="logo-wrap">
          <img class="logo" src="{{root}}assets/logo.png" alt="UglyDrone logo" />
          <h1 class="title">UGLYDRONE</h1>
          <p class="subtitle">Rugged • Modular • Ready</p>
        </div>
        <nav class="nav-bar">
          <a href="{{root}}index.html" class="nav-link {{active_blog}}" id="nav-blog">Blog</a>
          <a href="{{root}}about.html" class="nav-link {{active_about}}" id="nav-about">About</a>
        </nav>
      </header>
      <main>
        {{content}}
      </main>
    </div>
    <footer>
      <div class="footer-inner">
        <strong>Contact</strong>
        <div class="contact-grid">
          <div class="contact-item">
            <div class="label">Email</div>
            <a href="mailto:hello@uglydrone.com">hello@uglydrone.com</a>
          </div>
          <div class="contact-item">
            <div class="label">Address</div>
            <div>Florida, United States of America</div>
          </div>
        </div>
        <div style="color:var(--muted); font-size:.9rem; margin-top:6px">© <span id="year"></span> UglyDrone. All rights reserved.</div>
      </div>
      <script>
        document.getElementById('year').textContent=new Date().getFullYear();
        const root = document.documentElement;
        const btn = document.getElementById('themeBtn');
        const saved = localStorage.getItem('theme');
        if(saved){ root.setAttribute('data-theme', saved); }
        btn.addEventListener('click', () => {
          const curr = root.getAttribute('data-theme') || 'auto';
          const next = curr === 'dark' ? 'light' : (curr === 'light' ? 'auto' : 'dark');
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = `Theme: ${next}`;
        });
        btn.textContent = `Theme: ${root.getAttribute('data-theme')}`;
      </script>
    </footer>
  </body>
</html>
